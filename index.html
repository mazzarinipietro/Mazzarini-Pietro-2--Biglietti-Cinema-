<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazzarini Pietro 2 (Biglietti Cinema)</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script defer src="js/main.js"></script>
    <script defer type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>
    <!--Hero Section-->
    <section>
        <div class="hero">
            <img src="images/Hero gif.gif" alt="Hero-Gif">
        </div>
    </section>

    <!--Main Section-->
    <div class="main row text-center mt-2">
        <div class="col-12 lg:col-6">
            <h1>Biglietti Cinema</h1>
            <ul>
                <li>Costo per tutti: <span>8€</span></li>
                <li>Costo per minori di 5 anni: <span>free</span></li>
                <li>Costo per clienti con un eta compresa tra 18 e 25 anni: <span>3.5€</span></li>
                <li>Costo per clienti con un eta compresa tra 50 e i 55 anni: <span>5€</span></li>
            </ul>
        </div>
        <div class="col-12 lg:col-6">
            <h1>Lo Script</h1>
            <button onclick="calcolaPrezzo()">Acquista</button>
        </div>
    </div>

</body>

</html>
